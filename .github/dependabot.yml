version: 2
updates:
  - package-ecosystem: "docker-compose"
    directories:
      - "/deploy/local-gateway"
      - "/deploy/local-gateway/test"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
