version: 2
updates:
  - package-ecosystem: "docker-compose"
    directories:
      - "/deploy/local-gateway"
      - "/deploy/local-gateway/test"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5


    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      compatible-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns: ["*"]
        exclude-patterns:
          - "github/codeql-action/*"
        update-types: ["minor", "patch"]
      compatible-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        exclude-patterns:
          - "github/codeql-action/*"
        update-types: ["minor", "patch"]
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
