name: Fork CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fork-ci:
    name: fork-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out overlay
        uses: actions/checkout@v7

      - name: Enforce thin overlay boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e go.mod
          test ! -e go.sum
          test ! -d cmd/github-mcp-server
          test ! -d pkg/github
          test ! -d ui
          grep -Eq 'image: ghcr\.io/github/github-mcp-server:v[^@]+@sha256:[0-9a-f]{64}$' deploy/local-gateway/compose.yaml

      - name: Validate gateway
        run: |
          node --check deploy/local-gateway/public/gateway.mjs
          node --check deploy/local-gateway/public/policy.mjs
          node --test deploy/local-gateway/test/static-security.test.mjs
