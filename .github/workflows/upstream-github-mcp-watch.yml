name: Official GitHub MCP upstream release watch

on:
  schedule:
    - cron: "27 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ISSUE_TITLE: "Upstream watch: GitHub MCP image release"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare canonical image pin to official stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          file="deploy/local-gateway/compose.yaml"
          pinned="$(awk '/^[[:space:]]*image: ghcr.io\/github\/github-mcp-server:/ {
            sub(/.*github-mcp-server:/, "", $2); split($2, a, "@"); print a[1]
          }' "$file")"
          latest="$(gh api repos/github/github-mcp-server/releases/latest --jq .tag_name)"
          for tag in "$pinned" "$latest"; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
              { echo "::error::Unsupported release/image version: $tag"; exit 1; }
          done
          printf '%s\n' "Pinned image: $pinned; upstream stable: $latest" >> "$GITHUB_STEP_SUMMARY"
          behind=false
          if [[ "$pinned" != "$latest" ]] &&
            [[ "$(printf '%s\n' "$pinned" "$latest" | sort -V | head -n1)" == "$pinned" ]]; then
            behind=true
          fi
          number="$(gh issue list --state all --limit 500 --json number,title |
            jq -r --arg title "$ISSUE_TITLE" '.[] | select(.title == $title) | .number' | head -n1)"
          if [[ "$behind" == true ]]; then
            body="Pinned runtime: $pinned in $file
          New official release: $latest
          Release notes: https://github.com/github/github-mcp-server/releases/tag/$latest

          Review new tools, gateway policy, image digest, authentication, and overlay security CI before promotion. Dependabot may propose a PR; this issue is an independent watch signal. Do not deploy automatically."
            echo "::warning title=New GitHub MCP release::$pinned is behind $latest"
            if [[ -z "$number" ]]; then
              gh issue create --title "$ISSUE_TITLE" --body "$body"
            else
              if [[ "$(gh issue view "$number" --json body --jq .body)" != "$body" ]]; then
                gh issue edit "$number" --body "$body"
              fi
              if [[ "$(gh issue view "$number" --json state --jq .state)" == CLOSED ]]; then
                gh issue reopen "$number"
              fi
            fi
          elif [[ -n "$number" ]] && [[ "$(gh issue view "$number" --json state --jq .state)" == OPEN ]]; then
            gh issue close "$number" --comment "Canonical image is no longer behind the latest stable release."
          fi
