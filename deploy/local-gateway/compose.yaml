services:
  github-mcp:
    image: ghcr.io/github/github-mcp-server:v1.12.2@sha256:508a0857ec762b1ab1cece29193345b501fab1dd9d1228a7b617062954cecac6
    command:
      - http
      - --port=8082
      - --listen-host=0.0.0.0
      - --base-url=https://${GITHUB_MCP_PUBLIC_HOST}
      - --base-path=/mcp
    env_file:
      - ./config/github.env
    networks:
      - github_backend
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  github-gateway:
    image: node:26.9.0-alpine
    command:
      - sh
      - -eu
      - -c
      - |
        i=0
        while [ ! -s /run/github-mcp-secrets/github_pat ]; do
          i=$$((i + 1))
          if [ "$$i" -ge 400 ]; then
            echo "runtime GitHub credential was not injected; refusing to start" >&2
            exit 1
          fi
          sleep 0.05
        done
        exec node /app/gateway.mjs
    user: node
    env_file:
      - ./config/gateway.env
    environment:
      UPSTREAM_HOST: github-mcp
      UPSTREAM_PORT: "8082"
      UPSTREAM_PATH: "/"
      PORT: "8080"
      RATE_PER_MIN: "120"
      MAX_BODY_BYTES: "5242880"
    volumes:
      - ./public:/app:ro
    networks:
      github_backend:
      edge:
        aliases:
          - github-gateway
    depends_on:
      - github-mcp
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /run/github-mcp-secrets:rw,nosuid,nodev,noexec,size=64k,uid=1000,gid=1000,mode=0700
    post_start:
      - command:
          - sh
          - -eu
          - -c
          - |
            umask 077
            test -n "$$GITHUB_PAT_RUNTIME"
            printf '%s' "$$GITHUB_PAT_RUNTIME" > /run/github-mcp-secrets/github_pat
        user: node
        environment:
          GITHUB_PAT_RUNTIME: ${GITHUB_PAT_RUNTIME:?GitHub runtime PAT is required}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    restart: "no"

networks:
  github_backend:
    driver: bridge
  edge:
    external: true
    name: ${MCP_EDGE_NETWORK}
