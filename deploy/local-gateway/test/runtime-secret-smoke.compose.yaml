services:
  github-gateway-smoke:
    image: node:26.10.0-alpine
    command:
      - sh
      - -eu
      - -c
      - |
        i=0
        while [ ! -s /run/github-mcp-secrets/github_pat ]; do
          i=$$((i + 1))
          if [ "$$i" -ge 400 ]; then
            echo "runtime GitHub credential was not injected; refusing to start" >&2
            exit 1
          fi
          sleep 0.05
        done
        exec node /app/gateway.mjs
    user: node
    environment:
      ACCESS_TEAM_DOMAIN: example.cloudflareaccess.com
      ACCESS_AUD: test-audience
      ACCESS_ALLOWED_EMAILS: test@example.com
      ALLOW_SECRET_PATH: "0"
      UPSTREAM_HOST: 127.0.0.1
      UPSTREAM_PORT: "9"
      UPSTREAM_PATH: "/"
      PORT: "8080"
      RATE_PER_MIN: "120"
      MAX_BODY_BYTES: "5242880"
      GITHUB_PAT_FILE: /run/github-mcp-secrets/github_pat
      GATEWAY_SECRET_FILE: /run/github-mcp-secrets/gateway_secret
    volumes:
      - type: bind
        source: ${GITHUB_MCP_DEPLOY_ROOT:?Deployment root is required}/public
        target: /app
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /run/github-mcp-secrets:rw,nosuid,nodev,noexec,size=64k,uid=1000,gid=1000,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
