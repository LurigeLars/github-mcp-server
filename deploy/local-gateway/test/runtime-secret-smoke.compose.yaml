services:
  github-gateway:
    environment:
      ACCESS_TEAM_DOMAIN: example.cloudflareaccess.com
      ACCESS_AUD: test-audience
      ACCESS_ALLOWED_EMAILS: test@example.com
      UPSTREAM_HOST: 127.0.0.1
      UPSTREAM_PORT: "9"
    networks:
      - smoke
    post_start:
      - command:
          - sh
          - -eu
          - -c
          - |
            umask 077
            test -n "$$GITHUB_PAT_RUNTIME"
            printf '%s' "$$GITHUB_PAT_RUNTIME" > /run/github-mcp-secrets/github_pat
        user: node
        environment:
          GITHUB_PAT_RUNTIME: ${GITHUB_PAT_RUNTIME:?GitHub runtime PAT is required}
    restart: "no"
networks:
  smoke: {}
